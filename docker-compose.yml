# One container: the service, its browser worker, and the validator (docs/one-container.md).
#
# The service names its released GHCR image (linux/amd64 and linux/arm64, so a Raspberry Pi pulls
# a native build) and keeps its local build. Pull the release and start it without building:
#
#   docker compose pull && docker compose up -d
#
# `--build` builds from this checkout instead and tags the result with the same name. To keep
# local builds apart from the pulled release, give them another tag:
#
#   AMTRAK_IMAGE_TAG=local docker compose up -d --build
#
# Every optional source is on: Amtrak's own track and gate documents and the station notices
# come from the built-in browser worker on 127.0.0.1:8081 inside the container, the Hartford
# board is fetched directly, and NJ Transit tracks are on when RailData credentials are set.
# Each fails open. Turn sources off with their flags, for example:
#
#   AMTRAK_TRACKS=off AMTRAK_ADVISORIES=off docker compose up -d
#
# With AMTRAK_TRACKS_AMTRAK and AMTRAK_ADVISORIES both off, no Python or Chromium process runs.
#
# The worker uses chromium-headless-shell. If Amtrak blocks it, rebuild with full Chromium and Xvfb
# and run headful (a larger image and more memory on a Pi):
#
#   AMTRAK_IMAGE_TAG=local FETCHER_BROWSER_BUNDLE=full FETCHER_BROWSER_MODE=xvfb-headful \
#     docker compose up -d --build
#
# Without Compose, the image alone:
#
#   docker run -d -p 127.0.0.1:8090:8080 -v amtrak-data:/data ghcr.io/sohampatwardhan/amtrak-gtfs-rt

# Fixed so the volume and the pinned subnet below belong to one named project, whatever
# directory the stack is started from.
name: amtrak-gtfs-rt

services:
  amtrak-gtfs-rt:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BROWSER_BUNDLE: ${FETCHER_BROWSER_BUNDLE:-headless-shell}
    image: ghcr.io/sohampatwardhan/amtrak-gtfs-rt:${AMTRAK_IMAGE_TAG:-0.7.1}
    restart: unless-stopped
    environment:
      AMTRAK_TRACKS: ${AMTRAK_TRACKS:-on}
      AMTRAK_TRACKS_AMTRAK: ${AMTRAK_TRACKS_AMTRAK:-on}
      AMTRAK_ADVISORIES: ${AMTRAK_ADVISORIES:-on}
      NJT_RAILDATA_USERNAME: ${NJT_RAILDATA_USERNAME:-}
      NJT_RAILDATA_PASSWORD: ${NJT_RAILDATA_PASSWORD:-}
      # `gateway` is 172.31.240.1 below: the host, through the published port. 172.31.240.10 is
      # the optional proxy. The service ignores X-Forwarded-For and serves 127.0.0.1:8090 directly.
      AMTRAK_ALLOWED_PEER_IPS: gateway,172.31.240.10
      AMTRAK_PUBLIC_URL: http://127.0.0.1:8090
      BROWSER_MODE: ${FETCHER_BROWSER_MODE:-headless-shell}
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - amtrak-data:/data
    # Hardening. /data is the only writable volume; /tmp and the user's home (Chromium's profile)
    # are tmpfs. Chromium needs the larger /dev/shm.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/amtrak:size=256m,uid=10001,gid=10001,mode=0700
    shm_size: "64mb"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 512
    stop_grace_period: 10s
    networks: [amtrak]

  # Optional edge. Off unless started with `docker compose --profile proxy up`.
  # The service keeps publishing 127.0.0.1:8090. This does not replace it.
  proxy:
    profiles: ["proxy"]
    build:
      context: proxy
    image: amtrak-gtfs-rt-proxy:${AMTRAK_IMAGE_TAG:-0.7.1}
    restart: unless-stopped
    depends_on:
      - amtrak-gtfs-rt
    environment:
      AMTRAK_PROXY_TLS: ${AMTRAK_PROXY_TLS:-off}
      AMTRAK_PROXY_DOMAIN: ${AMTRAK_PROXY_DOMAIN:-}
      AMTRAK_PROXY_RATE_EVENTS: ${AMTRAK_PROXY_RATE_EVENTS:-120}
      AMTRAK_PROXY_RATE_WINDOW: ${AMTRAK_PROXY_RATE_WINDOW:-1m}
    ports:
      - "127.0.0.1:8091:8080"
      - "127.0.0.1:8443:8443"
    networks:
      amtrak:
        ipv4_address: 172.31.240.10

networks:
  amtrak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1

volumes:
  amtrak-data:
