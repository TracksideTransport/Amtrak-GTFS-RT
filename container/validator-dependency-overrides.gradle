/*
 * Security resolution policy for the pinned MobilityData GTFS Validator v8.0.1 source tree.
 *
 * The upstream release bundles older transitive libraries in its CLI fat JAR. Keep this list
 * deliberately small and exact: every override corresponds to an authoritative fixed version
 * reported by the release scan. The container build applies this as a Gradle init script, then
 * runs the validator test suite and scans the resulting JAR before it can reach the runtime.
 */

// Resolve from Google's Maven Central mirror first, then the original repositories. GitHub-hosted
// runners are rate-limited by Maven Central on a cold cache, and the plugin portal answers plugin
// dependencies with a redirect to Maven Central, so a cold build failed with "Could not find".
// Strict dependency verification (validator-verification-metadata.xml) checks every POM and JAR
// by SHA-256 whichever repository served it, so the mirror cannot change the bytes accepted.
def mavenCentralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

// Plugin markers (`*.gradle.plugin`) and the axion-release plugin's Gradle module metadata are
// published differently on the plugin portal, and the verification metadata records the portal's
// copies, so those still come from the portal.
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        maven {
            name = 'MavenCentralMirror'
            url = mavenCentralMirror
            content {
                excludeModuleByRegex('.*', '.*\\.gradle\\.plugin')
                excludeModule('pl.allegro.tech.build', 'axion-release-plugin')
            }
        }
        // badass-jlink-plugin is hosted only on the plugin portal, but the portal answers a request
        // for its Gradle module metadata with a redirect to Maven Central, which answers 404 when
        // it is reachable and 429 when it rate-limits the runner; Gradle treats the 429 as fatal.
        // Read this one plugin's POM from the portal and never ask for its module metadata.
        // (verification-metadata records its .jar and .pom, not a .module.)
        maven {
            name = 'PluginPortalPomOnly'
            url = 'https://plugins.gradle.org/m2/'
            metadataSources {
                mavenPom()
                artifact()
                // The POM carries Gradle's published-with-module-metadata marker; without this,
                // Gradle follows it to the .module and the portal's redirect to Maven Central.
                ignoreGradleMetadataRedirection()
            }
            content {
                includeModule('org.beryx', 'badass-jlink-plugin')
            }
        }
        gradlePluginPortal()
    }
}

allprojects { project ->
    project.repositories {
        maven {
            name = 'MavenCentralMirror'
            url = mavenCentralMirror
        }
    }

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    // Guava 33 publishes jsr305 as optional, so the pinned sources lose javax.annotation.Nullable.
    // Restore it as a transitive dependency of Guava. A direct dependency breaks :app:pkg, which
    // wraps one uber-jar as a Java module and cannot transform jsr305.
    project.dependencies.components.withModule("com.google.guava:guava") {
        allVariants {
            withDependencies {
                add("com.google.code.findbugs:jsr305:3.0.2")
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.force(
                'commons-beanutils:commons-beanutils:1.11.0',
                'org.apache.commons:commons-compress:1.26.0',
                'org.apache.commons:commons-lang3:3.18.0',
                'com.google.code.gson:gson:2.8.9',
                'com.google.guava:guava:33.7.2-jre',
                'ognl:ognl:3.4.13',
                'org.apache.httpcomponents.client5:httpclient5:5.6.3',
                'org.apache.httpcomponents.core5:httpcore5:5.4.3',
                'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3',
                'org.jsoup:jsoup:1.23.2'
        )
    }
}
