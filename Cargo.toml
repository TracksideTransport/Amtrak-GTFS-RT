[package]
name = "amtrak-gtfs-rt-service"
version = "0.9.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Serves live GTFS-Realtime feeds for Amtrak"
# `cargo run` starts the service; the optional `amtrak-status` CLI needs `--bin amtrak-status`.
default-run = "amtrak-gtfs-rt-service"

[features]
# Opt-in consumer tooling. The shipped service (`cargo build --locked --release`) does not enable
# this feature, so the `amtrak-status` binary stays out of the released artifact.
status = []

[dependencies]
amtrak-gtfs-rt = { git = "https://github.com/catenarytransit/amtrak-gtfs-rt" }
gtfs-structures = "0.46.1"
gtfs-realtime = "0.2.0"
prost = "0.14"
reqwest = "0.13"
async-trait = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
sha2 = "0.10.9"
# Rewrites stops.txt when platform stops are added to the published static feed. Already in the
# resolved graph through gtfs-structures.
csv = "1.4"
# Rewrites the static ZIP (copying untouched entries raw) when platform stops are added. Already
# resolved at this version through gtfs-structures; previously only a dev-dependency.
zip = { version = "6.0", default-features = false, features = ["deflate"] }
# Station local time with DST: the fallback source dates a train by its local departure at the
# origin, and the status CLI renders per-station times. Already linked into the service through
# `amtrak-gtfs-rt`, which dates the primary source's trains with it, so it adds no crate.
chrono-tz = "0.10"
chrono = "0.4"
# HTML parsing for the best-effort Service Alerts & Notices advisory scraper. Already resolved
# transitively via `amtrak-gtfs-rt` (which the service links), so this is a declaration edge only.
scraper = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Station & train status consumer CLI. Gated behind the `status` feature so the default build and
# the container image (which build no features) never compile this target.
[[bin]]
name = "amtrak-status"
path = "src/bin/amtrak_status.rs"
required-features = ["status"]
