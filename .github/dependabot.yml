# Dependabot version updates. Security updates are enabled in the repository settings and use the
# same per-ecosystem options below (labels, grouping) when they open pull requests.
#
# - labels: [] stops Dependabot creating its default `dependencies` and ecosystem labels; this
#   repository uses only its existing labels (see AGENTS.md, "GitHub issues").
# - Minor and patch updates are grouped into one pull request per ecosystem each week; major
#   updates arrive one pull request each, so a breaking change is reviewed on its own.
# - docker-compose.yml is not listed: its only images are this repository's own, whose tag the
#   release process sets.
#
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The service: Cargo.toml and Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The browser worker: browser-worker/requirements.txt (Playwright, pytest, cryptography).
  - package-ecosystem: "pip"
    directory: "/browser-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The SHA-pinned actions in .github/workflows. Dependabot keeps the SHA pins and their
  # version comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The digest-pinned base images in Dockerfile (Rust builder, Temurin, Python runtime) and
  # proxy/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/proxy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
