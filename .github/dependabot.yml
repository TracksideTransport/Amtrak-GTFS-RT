# Dependabot version updates. Security updates are enabled in the repository settings and use the
# same per-ecosystem options below (labels, grouping) when they open pull requests.
#
# - Pull requests carry Dependabot's default labels: `dependencies` and the ecosystem (`rust`,
#   `python`, `github_actions`, `docker`). An empty `labels` list did not stop it creating them.
# - Cargo and pip are checked weekly; GitHub Actions and the Docker base images, which change
#   often and rarely matter between releases, monthly.
# - Minor and patch updates are grouped into one pull request per ecosystem; major updates arrive
#   one pull request each, so a breaking change is reviewed on its own.
# - A cooldown keeps a new release out of version updates until it has been out for a while
#   (Cargo and pip: patch 3 days, minor 7, major 30; GitHub Actions and Docker, which Dependabot
#   allows only a single period for: 7 days),
#   so a release that is pulled or quickly patched upstream never reaches a pull request.
#   Security updates ignore the cooldown.
# - docker-compose.yml is not listed: its only images are this repository's own, whose tag the
#   release process sets.
#
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The service: Cargo.toml and Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The browser worker: browser-worker/requirements.txt (Playwright, pytest, cryptography).
  - package-ecosystem: "pip"
    directory: "/browser-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The SHA-pinned actions in .github/workflows. Dependabot keeps the SHA pins and their
  # version comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The digest-pinned base images in Dockerfile (Rust builder, Temurin, Python runtime) and
  # proxy/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/proxy"
    # Runtime upgrades of the base images are deliberate changes, not routine updates: Python
    # (the worker, Playwright, and cryptography wheels) and Rust (AGENTS.md pins the release
    # image's toolchain) get only patch tags and digest refreshes. eclipse-temurin is ignored
    # entirely: the validator stage must keep the exact JDK its reproducible JAR digest was
    # measured with, so even a 17-jdk digest refresh would fail the JAR digest check, and
    # Dependabot cannot tell that stage from the JRE stage. JRE security fixes still surface
    # through the release vulnerability gate, which fails on any fixable High or Critical match.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eclipse-temurin"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
