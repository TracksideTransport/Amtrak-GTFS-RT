# Dependabot version updates. Security updates are enabled in the repository settings and use the
# same per-ecosystem options below (labels, grouping) when they open pull requests.
#
# - labels: [] stops Dependabot creating its default `dependencies` and ecosystem labels; this
#   repository uses only its existing labels (see AGENTS.md, "GitHub issues").
# - Cargo and pip are checked weekly; GitHub Actions and the Docker base images, which change
#   often and rarely matter between releases, monthly.
# - Minor and patch updates are grouped into one pull request per ecosystem; major updates arrive
#   one pull request each, so a breaking change is reviewed on its own.
# - A cooldown keeps a new release out of version updates until it has been out for a while
#   (patch 3 days, minor 7, major 30; 7 for versions that are not SemVer, such as image digests),
#   so a release that is pulled or quickly patched upstream never reaches a pull request.
#   Security updates ignore the cooldown.
# - docker-compose.yml is not listed: its only images are this repository's own, whose tag the
#   release process sets.
#
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The service: Cargo.toml and Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The browser worker: browser-worker/requirements.txt (Playwright, pytest, cryptography).
  - package-ecosystem: "pip"
    directory: "/browser-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The SHA-pinned actions in .github/workflows. Dependabot keeps the SHA pins and their
  # version comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: []
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The digest-pinned base images in Dockerfile (Rust builder, Temurin, Python runtime) and
  # proxy/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/proxy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: []
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
