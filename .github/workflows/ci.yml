name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        # The gtfs-realtime crate's build script generates Rust bindings from
        # .proto files and requires the protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --all-targets --all-features --verbose

      - name: Test
        # Live tests against Amtrak's endpoints are #[ignore]d, so this job stays
        # deterministic and offline. They run in the validate-feeds workflow.
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Rustdoc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  browser-worker-tests:
    name: Browser worker offline tests
    # ubuntu-latest moved to 26.04, which has no CPython 3.12.11 build. Stay on 24.04,
    # where that exact interpreter is published.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: browser-worker/requirements.txt

      - name: Install exact test dependencies
        run: python -m pip install --requirement browser-worker/requirements.txt

      # No browser is downloaded or launched: Playwright is imported only where a browser starts.
      - name: Run offline unit tests
        working-directory: browser-worker
        run: python -m pytest tests -q

  one-image:
    name: One image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Native builds on each architecture, so the Dockerfile's ldd, static-binary, and Java checks
      # run on arm64 too. The full bundle is the xvfb-headful fallback; building it here keeps that
      # mode working. Base images and validator inputs are digest-pinned, so the cache only skips
      # recompiling unchanged stages.
      - name: Build the default (headless-shell) image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: amtrak-gtfs-rt:ci
          load: true
          cache-from: type=gha,scope=one-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=one-image-${{ matrix.arch }}
          sbom: false
          provenance: false

      - name: Build the full (Chromium and Xvfb) image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: BROWSER_BUNDLE=full
          tags: amtrak-gtfs-rt:ci-full
          load: true
          cache-from: type=gha,scope=one-image-${{ matrix.arch }}
          sbom: false
          provenance: false

      # Offline: no Amtrak call, so a blocked runner cannot fail it. The live smoke test runs in
      # release-gates.yml.
      - name: Offline smoke test
        run: scripts/test-image-offline.sh amtrak-gtfs-rt:ci amtrak-gtfs-rt:ci-full

      # The release's contract check: OCI labels, runtime config, and the license notices for
      # everything in the image. Unreleased builds carry the Dockerfile's dev/unknown labels.
      - name: Release contract and license notices
        run: |
          scripts/verify-release-image.sh amtrak-gtfs-rt:ci dev unknown ${{ matrix.arch }}
          scripts/verify-release-image.sh amtrak-gtfs-rt:ci-full dev unknown ${{ matrix.arch }}

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checksum-pinned release binary. The runner's shellcheck checks every `run:` script.
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version

      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

  repository-controls:
    name: Repository release-control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic release-control fixtures
        run: scripts/test-release-controls.sh

      - name: Fail on expired approved risk acceptances
        run: python3 scripts/check-risk-acceptance-expiry.py

      # No network and no Java: the validator gate's baseline ratchet logic and its retry helper
      # run on every pull request, while the live gate stays daily (#88, #89).
      - name: Test the validation baseline ratchet
        run: scripts/validate-feeds.sh --offline-fixtures --as-of 2026-08-13

      - name: Test the network retry helper
        run: scripts/test-lib-retry.sh

  offline-validators:
    name: Offline GTFS and GTFS-RT validators
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Path filtering happens inside the job, not in the workflow's `on:` block, so this check
      # always reports. A workflow-level filter would leave a required check pending forever on
      # a pull request that touches none of these paths. A push to main always runs it.
      - name: Decide whether feed-shaping paths changed
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo 'run=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -E '^(src/|examples/|Cargo\.(toml|lock)$|validation/|scripts/validate-feeds\.sh$|scripts/lib-retry\.sh$|\.github/workflows/(ci|validate-feeds)\.yml$)'; then
            echo 'run=true' >>"$GITHUB_OUTPUT"
          else
            echo 'run=false' >>"$GITHUB_OUTPUT"
            echo 'No feed-shaping path changed; skipping the validators.'
          fi

      - name: Install protoc
        if: steps.paths.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.paths.outputs.run == 'true'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.paths.outputs.run == 'true'

      - name: Set up Java 17
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same keys as the daily live gate, so both share one set of validator jars. They hash the
      # validator pins only: an unrelated edit to validate-feeds.sh must not force a cold Maven
      # build, which is when Maven Central answers HTTP 429 (#89).
      - name: Read the validator pins
        id: pins
        if: steps.paths.outputs.run == 'true'
        run: |
          key="$(grep -E '^(GTFS_VALIDATOR_VERSION|GTFS_VALIDATOR_SHA256|RT_VALIDATOR_COMMIT)=' scripts/validate-feeds.sh | sha256sum | cut -c1-16)"
          printf 'key=%s\n' "$key" >>"$GITHUB_OUTPUT"

      - name: Restore validator jars and the Maven repository
        id: cache
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .validator-cache
            ~/.m2/repository
          key: validators-${{ steps.pins.outputs.key }}
          restore-keys: validators-

      - name: Validate the fixture feed set (zero ERROR notices)
        if: steps.paths.outputs.run == 'true'
        run: ./scripts/validate-feeds.sh --fixture

      - name: Save validator jars and the Maven repository
        if: always() && steps.paths.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .validator-cache
            ~/.m2/repository
          key: validators-${{ steps.pins.outputs.key }}

      - name: Upload validation reports
        if: always() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-validation-reports-${{ github.run_attempt }}
          path: validation-reports/
          if-no-files-found: warn
          retention-days: 14

  packaging:
    name: Compose and bake config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate root compose and bake targets
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          scripts/test-proxy-compose.sh
          docker buildx bake --print >/dev/null
